name: Prepare pinned local engraving dependency
on:
  push:
    branches: [feature/sight-reading-finale-engraving-20261020]
    paths: [.github/workflows/prepare-sight-reading-engraving.yml]
permissions:
  contents: write
jobs:
  pin-verovio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sight-reading-finale-engraving-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install verovio@6.3.0 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(sight-reading): pin Verovio WASM for offline Vite bundle"
            git push origin HEAD:feature/sight-reading-finale-engraving-20261020
          fi
