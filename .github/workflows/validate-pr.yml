name: Validate Platform PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        timeout-minutes: 8
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Production build
        timeout-minutes: 5
        run: npm run build
