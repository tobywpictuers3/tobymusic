name: Validate Platform PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        timeout-minutes: 8
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: TOBY PLAY rules regression tests
        run: npm run test:music
      - name: Closed-year reconciliation safety tests
        run: node --test scripts/reconcile-closed-lessons.test.mjs
      - name: TypeScript diagnostic
        continue-on-error: true
        run: npx tsc --noEmit --pretty false
      - name: Sight-reading source and Bravura rendering regression
        run: node scripts/test-sight-reading-engraving.mjs
      - name: Sight-reading rhythm selection taxonomy
        run: node scripts/test-sight-reading-rhythm-filters.mjs
      - name: Sight-reading A4 print paging regression
        run: node scripts/test-sight-reading-print-pages.mjs
      - name: Sight-reading branded PDF and Gmail ordering
        run: node scripts/test-sight-reading-pdf-mail-flow.mjs
      - name: Student Gmail CORS regression
        run: node scripts/test-student-gmail-simple-post.mjs
      - name: Production build
        timeout-minutes: 5
        run: npm run build
